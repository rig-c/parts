# CI: typecheck, lint, the selftest, and the package itself.
#
# The selftest is the gate that matters. Every check in it has a planted input
# that makes it fire, so a green run means the failures are still reachable —
# not merely that nothing threw. Nothing here asserts timing, and the selftest
# reports an absent corpus as a HOLE, never as a pass.
#
# Issue #1505 splits CI into two tiers:
#   - Light PR tier (ordinary pull_request and push to main): runs typecheck,
#     lint, check:readme, tree-verdict, the five selftest shards filtered to the
#     suites selected by scripts/ci_tier.ts (always including tree and
#     run-tally), selftest merge, packed install on ubuntu-latest, and
#     conditional jobs (expected-files, painting-public, standalone checks) when
#     their inputs are touched.
#   - Full release tier (release PRs, PRs touching full-tier paths, the daily
#     scheduled full run on main at 03:17 UTC, and workflow_dispatch): runs
#     all 75 selftest suites across all five shards, expected-files,
#     build-platforms (Ubuntu, macOS, Windows), install-platforms (Ubuntu,
#     macOS, Windows, and npm release), and stamps tree-verdict-receipt.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily non-blocking full run on main at 03:17 UTC (12:17 KST), chosen from
    # the 03:00-03:59 UTC zero-run trough in the 300-run histogram (#1505).
    - cron: '17 3 * * *'
  # The release pull request gets a `pull_request` run like any other, and a
  # manual dispatch selects the full tier by default (`tier: full`).
  workflow_dispatch:
    inputs:
      tier:
        description: 'Verification tier to run (full or light)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - light

permissions:
  contents: read
  actions: read
  pull-requests: read

# A newer push to the same pull request cancels its superseded run, so a stale
# head stops holding runners (issue #1110). Every other event groups by commit
# and is never cancelled: each merge commit on main keeps its own verdict.
# release.yml has no such group — a cancelled publish is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tree-verdict:
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      run-id: ${{ steps.reuse.outputs.run-id }}
      head-sha: ${{ steps.reuse.outputs.head-sha }}
      tested-sha: ${{ steps.reuse.outputs.tested-sha }}
      pr: ${{ steps.reuse.outputs.pr }}
      tier: ${{ steps.plan.outputs.tier }}
      suites: ${{ steps.plan.outputs.suites }}
      run-expected-files: ${{ steps.plan.outputs.run_expected_files }}
      run-painting-public: ${{ steps.plan.outputs.run_painting_public }}
      run-standalone-tools: ${{ steps.plan.outputs.run_standalone_tools }}
      run-build-platforms: ${{ steps.plan.outputs.run_build_platforms }}
      run-full-installs: ${{ steps.plan.outputs.run_full_installs }}
      install-matrix: ${{ steps.plan.outputs.install_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - id: reuse
        uses: rig-c/core/.github/actions/tree-verdict@149bca5fc828c60416283de0a1aa570ed33f385f
        with:
          declaration: scripts/tree-verdict.json
      - name: Check workflow coverage and verdict wiring
        env:
          TREE_VERDICT_TOOLS: ${{ steps.reuse.outputs.tooling-path }}
        run: bun "$TREE_VERDICT_TOOLS/../../../scripts/lint_workflows.ts" scripts/lint_workflows.declarations.json .
      - name: Check CI tier selector and planted failures
        run: bun scripts/check_ci_tier.ts --quiet
      - name: Plan verification tier and suite selection
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TIER: ${{ inputs.tier }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci_tier.ts plan

  # The selftest runs in five shards (issues #395, #849, #1021, #1456, #1505).
  # SHARDS in selftest.ts assigns every unit exactly once; test below merges the
  # records. In the light tier, each shard filters its assigned units to the
  # suites selected by scripts/ci_tier.ts; in the full tier, every unit runs.
  #
  # ⚠️ The matrix names the shards SHARDS names. A shard here and not there is
  # refused when it starts; one there and not here leaves no record, which the
  # merge refuses by name.
  shard:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true'
    name: selftest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', '5']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Configure light-tier shard filter
        if: needs.tree-verdict.outputs.tier == 'light'
        env:
          CI_TIER: ${{ needs.tree-verdict.outputs.tier }}
          CI_SUITES: ${{ needs.tree-verdict.outputs.suites }}
        run: bun scripts/ci_tier.ts install-shim --tier "$CI_TIER" --suites "$CI_SUITES"

      # Its units run in worker processes, as many at once as the runner has
      # cores, capped at two by default for one 6 GiB slot; the step is red
      # when a unit wrote no result, failed, or exceeded the family RSS budget. The
      # record is uploaded either way, so the merge can name what went wrong.
      - name: Run this shard's units
        run: bun selftest.ts --shard ${{ matrix.shard }} --record shards/shard-${{ matrix.shard }}.json
      # The ordinary sample suite uses generated fixtures. These five pinned
      # public assemblies separately hold owner-allocation error membership.
      - name: Restore the pinned examples
        if: matrix.shard == '3' && needs.tree-verdict.outputs.run-painting-public == 'true'
        id: examples
        uses: actions/cache@v4
        with:
          path: examples/*/inputs
          key: examples-inputs-${{ hashFiles('scripts/fetch-examples.sh') }}
      - name: Fetch pinned painting allocation examples
        if: matrix.shard == '3' && needs.tree-verdict.outputs.run-painting-public == 'true' && steps.examples.outputs.cache-hit != 'true'
        run: bun run fetch-examples
      - name: Check public painting allocation membership
        if: matrix.shard == '3' && needs.tree-verdict.outputs.run-painting-public == 'true'
        timeout-minutes: 12
        run: |
          for example in demo reference-demo reference-sample scarf wind; do
            bun tools/check_painting_public.ts "$example" || exit "$?"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-shard-${{ matrix.shard }}
          path: shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Issue #1439: the five examples' expected/ and wind's expected-wave/ are this
  # package's own builds, written on Linux by tools/regenerate_examples.ts. Here
  # they are rebuilt and compared whole, byte for byte, machine-class fields
  # included (this runner is Linux). Each public build also composes (#1500).
  # Fetched-art builds run beside the selftest shards as in #1113. The job
  # uses the same cache as shard 3, keyed by the fetch script that pins the
  # input commit. The tool refuses inputs that are not the pinned blobs.
  expected-files:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true' && needs.tree-verdict.outputs.run-expected-files == 'true'
    name: expected files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Restore the pinned examples
        id: examples
        uses: actions/cache@v4
        with:
          path: examples/*/inputs
          key: examples-inputs-${{ hashFiles('scripts/fetch-examples.sh') }}
      - name: Fetch pinned painting allocation examples
        if: steps.examples.outputs.cache-hit != 'true'
        run: bun run fetch-examples
      - name: Build and compose the public examples and compare the expected files
        run: bun tools/regenerate_examples.ts --check --set examples

  # Fresh runs replay every available shard even after a shard failure, so
  # the original tally names missing or crashed units. The required test-status
  # job reports failures; reused runs skip the merge.
  test:
    name: selftest merge
    needs: [tree-verdict, shard]
    if: ${{ always() && needs.tree-verdict.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check README scope and planted failures
        run: bun run check:readme
      - run: bun run typecheck
      - run: bun run lint
      - name: Check receipted matte against a fake ComfyUI
        if: needs.tree-verdict.outputs.run-standalone-tools == 'true'
        run: bun tools/check_matte.ts
      - name: Check core plate pad-to-8 transform against a fake ComfyUI
        if: needs.tree-verdict.outputs.run-standalone-tools == 'true'
        run: bun tools/check_core_grid.ts
      - name: Check core plate --cfg against a fake ComfyUI
        if: needs.tree-verdict.outputs.run-standalone-tools == 'true'
        run: bun tools/check_core_cfg.ts
      - name: Check opt-in run stamp clock with local stage doubles
        if: needs.tree-verdict.outputs.run-standalone-tools == 'true'
        run: bun tools/check_run_clock.ts
      - name: Check ComfyUI client timeouts and poll retries against local stubs
        if: needs.tree-verdict.outputs.run-standalone-tools == 'true'
        run: bun test tools/comfy_client.test.ts
      - name: Check assemble edge splits on a synthetic hem fixture
        if: needs.tree-verdict.outputs.run-standalone-tools == 'true'
        run: bun test ./fixtures/edge_split.ts
      - uses: actions/download-artifact@v4
        with:
          pattern: selftest-shard-*
          path: shards
          merge-multiple: true
      - name: Configure light-tier shard merge
        if: needs.tree-verdict.outputs.tier == 'light'
        env:
          CI_TIER: ${{ needs.tree-verdict.outputs.tier }}
          CI_SUITES: ${{ needs.tree-verdict.outputs.suites }}
        run: bun scripts/ci_tier.ts install-shim --tier "$CI_TIER" --suites "$CI_SUITES"
      - name: Merge the shards into one selftest run
        run: bun selftest.ts --merge shards

  # Gate full-tree receipt creation to full-tier non-scheduled runs so a
  # light-tier partial run never stamps a full-tree receipt (#1505).
  receipt-eligible:
    needs: [tree-verdict, shard, test, expected-files, install-platforms, build-platforms]
    if: ${{ needs.tree-verdict.outputs.reused != 'true' && needs.tree-verdict.outputs.tier == 'full' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full-tier run eligible for tree-verdict receipt"

  # Fresh receipts attest the successful full-tier shard matrix and semantic merge.
  tree-verdict-receipt:
    needs: [shard, test, expected-files, receipt-eligible]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: tools
        uses: rig-c/core/.github/actions/tree-verdict@149bca5fc828c60416283de0a1aa570ed33f385f
      - id: receipt
        env:
          TREE_VERDICT_TOOLS: ${{ steps.tools.outputs.tooling-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun "$TREE_VERDICT_TOOLS/producer.mjs" --declaration scripts/tree-verdict.json --out "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.receipt.outputs.receipt-created == 'true' }}
        with:
          name: tree-verdict-receipt
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          overwrite: true

  # Keep the required check successful only for fresh green work or reuse.
  test-status:
    name: test
    needs: [tree-verdict, shard, test, expected-files]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the selftest verdict
        env:
          LOOKUP_RESULT: ${{ needs.tree-verdict.result }}
          REUSED: ${{ needs.tree-verdict.outputs.reused }}
          RUN_EXPECTED_FILES: ${{ needs.tree-verdict.outputs.run-expected-files }}
          SOURCE_PR: ${{ needs.tree-verdict.outputs.pr }}
          SOURCE_HEAD: ${{ needs.tree-verdict.outputs.head-sha }}
          SOURCE_TESTED: ${{ needs.tree-verdict.outputs.tested-sha }}
          SOURCE_RUN: ${{ needs.tree-verdict.outputs.run-id }}
          SHARD_RESULT: ${{ needs.shard.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EXPECTED_FILES_RESULT: ${{ needs.expected-files.result }}
        run: |
          test "$LOOKUP_RESULT" = success
          if [ "$REUSED" = true ]; then
            echo "Reused PR $SOURCE_PR head $SOURCE_HEAD tested $SOURCE_TESTED run $SOURCE_RUN"
          else
            test "$SHARD_RESULT" = success
            test "$TEST_RESULT" = success
            if [ "$RUN_EXPECTED_FILES" = true ]; then
              test "$EXPECTED_FILES_RESULT" = success
            else
              test "$EXPECTED_FILES_RESULT" = skipped
            fi
          fi

  # Whether the PACKAGE runs, which nothing else here asks. `prepublishOnly`
  # gates the source tree and `release.yml` gates the packaged build through
  # `@rig-c/play` before publication; neither starts the program from a fresh
  # cross-platform install on PR CI.
  #
  # ⭐ A separate job on purpose, with no `bun install` in it: the question is
  # whether a stranger's machine can run the package, and a job that had first
  # installed this repository's dev dependencies would be answering it with the
  # repository's own tooling on hand. `scripts/install_smoke.ts` imports nothing
  # but node builtins for the same reason.
  #
  # 🌱 The plants run here too, and that is the point of running them: three
  # packages broken on purpose — `src/layers.ts` out of the pack, `@rig-c/core`
  # out of `dependencies`, `ag-psd` out of `dependencies` — each of which has to
  # make the smoke RED naming what went missing. Without them this job is a gate
  # nobody has seen fail.
  #
  # 🕳️ What it cannot see: it runs the tarball this tree packs, which is not the
  # tarball npm serves until a publish makes it one. That half is
  # `release.yml`'s confirmation step.
  install-platforms:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true'
    # In the light tier, install-matrix runs ubuntu-latest (bundled npm).
    # In the full tier, it runs ubuntu-latest, macos-latest, windows-latest,
    # and the ubuntu-latest (npm release) entry matching release.yml's npm.
    name: packed install ${{ matrix.os }} Bun ${{ matrix.bun }}${{ matrix.npm == 'release' && ' (npm release)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tree-verdict.outputs.install-matrix) }}
    # Recent 40 Windows jobs: 35 green, p95 510s, max 546s (job time).
    # Run 42282469376, job 128114964904 is that maximum; 15m leaves 354s.
    # The smoke step alone had p95 482s and max 525s; setup shares this cap.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      # npm packs and installs, and the bin shim runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: ${{ matrix.npm == 'release' && 'https://registry.npmjs.org' || '' }}
      - name: Use the release job's npm
        if: ${{ matrix.npm == 'release' }}
        # Keep equal to the npm pinned in release.yml.
        run: |
          npm install -g npm@12.2.2
          npm --version
      - name: The package installs into an empty directory and runs from there
        run: bun run smoke

  build-platforms:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true' && needs.tree-verdict.outputs.run-build-platforms == 'true'
    name: build controls ${{ matrix.os }} Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: [latest]
    # Green matrix run 39963251495: maximum Windows native-build job
    # 120446378030 took 746 seconds (minimum Bun); latest Bun took 474.
    # 746 * 1.5 = 1119 seconds; round UP to 5-minute units = 20 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build stage controls on this host and Bun
        shell: bash
        env:
          RIG_PARTS_SELFTEST_JOBS: '1'
        run: |
          set +e
          summary="$RUNNER_TEMP/build-controls-summary.json"
          rm -f "$summary"
          bun selftest.ts --only build --summary-json "$summary"
          status=$?
          # Exit 2 also means broken accounting (including overlong log lines).
          # Require the measured green partial verdict, not just its exit code.
          test "$status" -eq 2 || exit 1
          node --input-type=module - "$summary" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const summary = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(summary.spec, 'rig-selftest-summary/1');
          assert.equal(summary.exit, 2);
          assert.equal(summary.partial, true);
          assert.deepEqual(summary.only, ['build']);
          assert.deepEqual(summary.faults, []);
          assert.equal(summary.totals.failed, 0);
          assert.equal(summary.totals.holes, 0);
          const build = summary.suites.find(suite => suite.suite === 'build');
          assert.equal(build?.status, 'pass');
          assert.equal(build?.ran, true);
          assert.ok(build.controls > 0);
          assert.equal(build.failed, 0);
          JS

  # Preserve the required check name in both tiers.
  installs:
    needs: [tree-verdict, install-platforms, build-platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every installation and stage control passed
        env:
          LOOKUP_RESULT: ${{ needs.tree-verdict.result }}
          REUSED: ${{ needs.tree-verdict.outputs.reused }}
          RUN_BUILD_PLATFORMS: ${{ needs.tree-verdict.outputs.run-build-platforms }}
          SOURCE_PR: ${{ needs.tree-verdict.outputs.pr }}
          SOURCE_HEAD: ${{ needs.tree-verdict.outputs.head-sha }}
          SOURCE_TESTED: ${{ needs.tree-verdict.outputs.tested-sha }}
          SOURCE_RUN: ${{ needs.tree-verdict.outputs.run-id }}
          INSTALLS_RESULT: ${{ needs.install-platforms.result }}
          BUILD_CONTROLS_RESULT: ${{ needs.build-platforms.result }}
        run: |
          test "$LOOKUP_RESULT" = success
          if [ "$REUSED" = true ]; then
            echo "Reused PR $SOURCE_PR head $SOURCE_HEAD tested $SOURCE_TESTED run $SOURCE_RUN"
          else
            test "$INSTALLS_RESULT" = success
            if [ "$RUN_BUILD_PLATFORMS" = true ]; then
              test "$BUILD_CONTROLS_RESULT" = success
            else
              test "$BUILD_CONTROLS_RESULT" = skipped
            fi
          fi

  # When the daily scheduled full run on main goes red, open or comment on an
  # issue naming the failing jobs and the commit range since the last green
  # full run (#1505).
  scheduled-report:
    name: scheduled full run report
    needs: [tree-verdict, shard, test, expected-files, install-platforms, build-platforms, test-status, installs]
    if: ${{ always() && github.event_name == 'schedule' && (needs.test-status.result != 'success' || needs.installs.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Open or update the scheduled full-run failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: bun scripts/ci_tier.ts report-scheduled-failure
