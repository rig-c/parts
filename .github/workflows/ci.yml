# CI: typecheck, lint, the selftest, and the package itself.
#
# The selftest is the gate that matters. Every check in it has a planted input
# that makes it fire, so a green run means the failures are still reachable —
# not merely that nothing threw. Nothing here asserts timing, and the selftest
# reports an absent corpus as a HOLE, never as a pass.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release pull request gets a `pull_request` run like any other, but a run
  # started by GITHUB_TOKEN lands in `action_required`, so that pull request's
  # required check reads as blocked until a human approves it — a standing step
  # of every cut (RELEASING.md). A run started from the Actions tab cannot stand
  # in for that approval: a required check is matched by the run that reported
  # it, not by the SHA. This trigger is a manual lever and nothing more.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# A newer push to the same pull request cancels its superseded run, so a stale
# head stops holding runners (issue #1110). Every other event groups by commit
# and is never cancelled: each merge commit on main keeps its own verdict.
# release.yml has no such group — a cancelled publish is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tree-verdict:
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      run-id: ${{ steps.reuse.outputs.run-id }}
      head-sha: ${{ steps.reuse.outputs.head-sha }}
      tested-sha: ${{ steps.reuse.outputs.tested-sha }}
      pr: ${{ steps.reuse.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: reuse
        uses: rig-c/core/.github/actions/tree-verdict@08b45c6fbd3664a0dc77050c04b7359d2346f7a6
        with:
          declaration: scripts/tree-verdict.json
      - name: Check workflow coverage and verdict wiring
        env:
          TREE_VERDICT_TOOLS: ${{ steps.reuse.outputs.tooling-path }}
        run: bun "$TREE_VERDICT_TOOLS/../../../scripts/lint_workflows.ts" scripts/lint_workflows.declarations.json .

  # The selftest runs in four shards (issues #395, #849, #1021). SHARDS in
  # selftest.ts assigns every unit exactly once; test below merges the records.
  # Issue #1021 uses PR CI unit clocks and capped case-timing samples to split
  # check's fixture helpers into separately scheduled units. SHARDS documents
  # the measured inputs and the estimates the next PR CI run must confirm.
  # The two-worker default and 25-minute timeout remain unchanged.
  # A shard judges nothing: its record holds every line its units printed, and
  # the merge prints and counts them as one whole run would.
  #
  # ⚠️ The matrix names the shards SHARDS names. A shard here and not there is
  # refused when it starts; one there and not here leaves no record, which the
  # merge refuses by name.
  shard:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true'
    name: selftest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Its units run in worker processes, as many at once as the runner has
      # cores, capped at two by default for one 6 GiB slot; the step is red
      # when a unit wrote no result, failed, or exceeded the family RSS budget. The
      # record is uploaded either way, so the merge can name what went wrong.
      - name: Run this shard's units
        run: bun selftest.ts --shard ${{ matrix.shard }} --record shards/shard-${{ matrix.shard }}.json
      # The ordinary sample suite uses generated fixtures. These five pinned
      # public assemblies separately hold owner-allocation error membership.
      - name: Fetch pinned painting allocation examples
        if: matrix.shard == '3'
        run: bun run fetch-examples
      - name: Check public painting allocation membership
        if: matrix.shard == '3'
        timeout-minutes: 12
        run: |
          for example in demo reference-demo reference-sample scarf wind; do
            bun tools/check_painting_public.ts "$example" || exit "$?"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-shard-${{ matrix.shard }}
          path: shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Fresh runs replay every available shard even after a shard failure, so
  # the original tally names missing or crashed units. The required test-status
  # job reports failures; reused runs skip the merge.
  test:
    name: selftest merge
    needs: [tree-verdict, shard]
    if: ${{ always() && needs.tree-verdict.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check README scope and planted failures
        run: bun run check:readme
      - run: bun run typecheck
      - run: bun run lint
      - name: Check receipted matte against a fake ComfyUI
        run: bun tools/check_matte.ts
      - name: Check core plate pad-to-8 transform against a fake ComfyUI
        run: bun tools/check_core_grid.ts
      - name: Check core plate --cfg against a fake ComfyUI
        run: bun tools/check_core_cfg.ts
      - name: Check opt-in run stamp clock with local stage doubles
        run: bun tools/check_run_clock.ts
      - name: Check ComfyUI client timeouts and poll retries against local stubs
        run: bun test tools/comfy_client.test.ts
      - name: Check assemble edge splits on a synthetic hem fixture
        run: bun test ./fixtures/edge_split.ts
      - uses: actions/download-artifact@v4
        with:
          pattern: selftest-shard-*
          path: shards
          merge-multiple: true
      - name: Merge the shards into one selftest run
        run: bun selftest.ts --merge shards

  # Fresh receipts attest the successful shard matrix and semantic merge.
  tree-verdict-receipt:
    needs: [shard, test]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: tools
        uses: rig-c/core/.github/actions/tree-verdict@08b45c6fbd3664a0dc77050c04b7359d2346f7a6
      - id: receipt
        env:
          TREE_VERDICT_TOOLS: ${{ steps.tools.outputs.tooling-path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun "$TREE_VERDICT_TOOLS/producer.mjs" --declaration scripts/tree-verdict.json --out "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.receipt.outputs.receipt-created == 'true' }}
        with:
          name: tree-verdict-receipt
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          overwrite: true

  # Keep the required check successful only for fresh green work or reuse.
  test-status:
    name: test
    needs: [tree-verdict, shard, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the full selftest verdict
        env:
          LOOKUP_RESULT: ${{ needs.tree-verdict.result }}
          REUSED: ${{ needs.tree-verdict.outputs.reused }}
          SOURCE_PR: ${{ needs.tree-verdict.outputs.pr }}
          SOURCE_HEAD: ${{ needs.tree-verdict.outputs.head-sha }}
          SOURCE_TESTED: ${{ needs.tree-verdict.outputs.tested-sha }}
          SOURCE_RUN: ${{ needs.tree-verdict.outputs.run-id }}
          SHARD_RESULT: ${{ needs.shard.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LOOKUP_RESULT" = success
          if [ "$REUSED" = true ]; then
            echo "Reused PR $SOURCE_PR head $SOURCE_HEAD tested $SOURCE_TESTED run $SOURCE_RUN"
          else
            test "$SHARD_RESULT" = success
            test "$TEST_RESULT" = success
          fi

  # Whether the PACKAGE runs, which nothing else here asks. `prepublishOnly`
  # gates the source tree and the `ships` job below reads packed path lists;
  # neither starts the program from an install.
  #
  # ⭐ A separate job on purpose, with no `bun install` in it: the question is
  # whether a stranger's machine can run the package, and a job that had first
  # installed this repository's dev dependencies would be answering it with the
  # repository's own tooling on hand. `scripts/install_smoke.ts` imports nothing
  # but node builtins for the same reason.
  #
  # 🌱 The plants run here too, and that is the point of running them: three
  # packages broken on purpose — `src/layers.ts` out of the pack, `@rig-c/core`
  # out of `dependencies`, `ag-psd` out of `dependencies` — each of which has to
  # make the smoke RED naming what went missing. Without them this job is a gate
  # nobody has seen fail.
  #
  # 🕳️ What it cannot see: it runs the tarball this tree packs, which is not the
  # tarball npm serves until a publish makes it one. That half is
  # `release.yml`'s confirmation step.
  install-platforms:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true'
    name: packed install ${{ matrix.os }} Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: [latest]
    # Recent 40 Windows jobs: 35 green, p95 510s, max 546s (job time).
    # Run 42282469376, job 128114964904 is that maximum; 15m leaves 354s.
    # The smoke step alone had p95 482s and max 525s; setup shares this cap.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      # npm packs and installs, and the bin shim runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The package installs into an empty directory and runs from there
        run: bun run smoke

  build-platforms:
    needs: tree-verdict
    if: needs.tree-verdict.outputs.reused != 'true'
    name: build controls ${{ matrix.os }} Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: [latest]
    # Green matrix run 39963251495: maximum Windows native-build job
    # 120446378030 took 746 seconds (minimum Bun); latest Bun took 474.
    # 746 * 1.5 = 1119 seconds; round UP to 5-minute units = 20 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build stage controls on this host and Bun
        shell: bash
        env:
          RIG_PARTS_SELFTEST_JOBS: '1'
        run: |
          set +e
          bun selftest.ts --only build
          status=$?
          test "$status" -eq 2

  # Preserve the required check name; BOTH matrices must finish green.
  installs:
    needs: [tree-verdict, install-platforms, build-platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every installation and stage control passed
        env:
          LOOKUP_RESULT: ${{ needs.tree-verdict.result }}
          REUSED: ${{ needs.tree-verdict.outputs.reused }}
          SOURCE_PR: ${{ needs.tree-verdict.outputs.pr }}
          SOURCE_HEAD: ${{ needs.tree-verdict.outputs.head-sha }}
          SOURCE_TESTED: ${{ needs.tree-verdict.outputs.tested-sha }}
          SOURCE_RUN: ${{ needs.tree-verdict.outputs.run-id }}
          INSTALLS_RESULT: ${{ needs.install-platforms.result }}
          BUILD_CONTROLS_RESULT: ${{ needs.build-platforms.result }}
        run: |
          test "$LOOKUP_RESULT" = success
          if [ "$REUSED" = true ]; then
            echo "Reused PR $SOURCE_PR head $SOURCE_HEAD tested $SOURCE_TESTED run $SOURCE_RUN"
          else
            test "$INSTALLS_RESULT" = success
            test "$BUILD_CONTROLS_RESULT" = success
          fi
